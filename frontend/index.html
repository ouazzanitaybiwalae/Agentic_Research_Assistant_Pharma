<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Pharma Research Assistant</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f5f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
    }

    main {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #326b61;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3rem);
      letter-spacing: -0.045em;
      line-height: 1.1;
    }

    .intro {
      margin: 16px 0 28px;
      color: #596579;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .panel,
    .answer-card {
      border: 1px solid #e1e6ef;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 12px 32px rgb(23 32 51 / 6%);
    }

    .panel {
      padding: 24px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-size: 0.95rem;
      font-weight: 650;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 150px;
      resize: vertical;
      border: 1px solid #cbd3df;
      border-radius: 10px;
      padding: 14px 15px;
      color: inherit;
      background: #fcfdff;
      font: inherit;
      line-height: 1.5;
    }

    textarea:focus {
      border-color: #347d70;
      outline: 3px solid rgb(52 125 112 / 16%);
    }

    .form-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 16px;
    }

    .hint {
      margin: 0;
      color: #68758a;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    button {
      flex: 0 0 auto;
      min-height: 46px;
      border: 0;
      border-radius: 9px;
      padding: 0 20px;
      color: #fff;
      background: #27695e;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #1e574e;
    }

    button:focus-visible {
      outline: 3px solid rgb(52 125 112 / 35%);
      outline-offset: 3px;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .status {
      min-height: 1.5em;
      margin: 14px 0 0;
      color: #596579;
      font-size: 0.9rem;
    }

    .status.error {
      color: #a52e38;
    }

    .answer-card {
      margin-top: 24px;
      padding: 24px;
    }

    .answer-card[hidden] {
      display: none;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 1.1rem;
    }

    .answer {
      margin: 0;
      color: #343f52;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .answer > :first-child {
      margin-top: 0;
    }

    .answer > :last-child {
      margin-bottom: 0;
    }

    .answer h1,
    .answer h2,
    .answer h3,
    .answer h4,
    .answer h5,
    .answer h6 {
      margin: 1.25em 0 0.55em;
      letter-spacing: normal;
      line-height: 1.3;
    }

    .answer h1 {
      font-size: 1.6rem;
    }

    .answer h2 {
      font-size: 1.35rem;
    }

    .answer h3,
    .answer h4,
    .answer h5,
    .answer h6 {
      font-size: 1.1rem;
    }

    .answer p,
    .answer ul,
    .answer ol,
    .answer blockquote {
      margin: 0.75em 0;
    }

    .answer ul,
    .answer ol {
      padding-left: 1.6rem;
    }

    .answer li + li {
      margin-top: 0.3em;
    }

    .answer li > ul,
    .answer li > ol {
      margin: 0.3em 0;
    }

    .answer blockquote {
      border-left: 3px solid #cbd9d5;
      padding-left: 1rem;
      color: #596579;
    }

    .answer a {
      color: #27695e;
      text-underline-offset: 0.15em;
    }

    .answer code {
      border-radius: 4px;
      padding: 0.1em 0.3em;
      background: #f0f3f7;
      font-size: 0.9em;
    }

    .answer pre {
      overflow-x: auto;
      border-radius: 8px;
      padding: 14px;
      background: #f0f3f7;
    }

    .answer pre code {
      padding: 0;
      background: transparent;
    }

    .answer hr {
      border: 0;
      border-top: 1px solid #e1e6ef;
      margin: 1.25em 0;
    }

    .disclaimer {
      margin: 32px 0 0;
      border: 1px solid #e1e6ef;
      border-left: 6px solid #c97a00;
      border-radius: 12px;
      padding: 18px 22px 20px;
      background: transparent;
      color: #2c3548;
    }

    .disclaimer-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e1e6ef;
      color: #8a4b00;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .disclaimer-icon {
      flex: none;
      width: 24px;
      height: 24px;
    }

    .answer .disclaimer-text {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }

    @media (max-width: 560px) {
      body {
        padding: 32px 16px;
      }

      .panel,
      .answer-card {
        padding: 19px;
      }

      .disclaimer {
        margin-top: 24px;
        border-left-width: 5px;
        padding: 14px 16px 16px;
      }

      .disclaimer-title {
        font-size: 0.78rem;
        letter-spacing: 0.06em;
      }

      .form-footer {
        align-items: stretch;
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Local corpus - Evidence-based research</p>
    <h1>Pharma Research Assistant</h1>
    <p class="intro">
      Ask a question about the medication information in the provided corpus. Responses include
      source citations and are for research purposes only.
    </p>

    <form class="panel" id="ask-form">
      <label for="question">Your research question</label>
      <textarea
        id="question"
        name="question"
        placeholder="For example: What contraindications does the corpus list for warfarin?"
        required
      ></textarea>
      <div class="form-footer">
        <p class="hint">Use a specific question for more focused source retrieval.</p>
        <button id="ask-button" type="submit">Ask</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>

    <section class="answer-card" id="answer-card" aria-labelledby="answer-heading" hidden>
      <h2 id="answer-heading">Research answer</h2>
      <div class="answer" id="answer"></div>
    </section>
  </main>

  <script src="/static/marked.umd.js"></script>
  <script src="/static/purify.min.js"></script>
  <script>
    const form = document.querySelector("#ask-form");
    const questionField = document.querySelector("#question");
    const askButton = document.querySelector("#ask-button");
    const statusMessage = document.querySelector("#status");
    const answerCard = document.querySelector("#answer-card");
    const answerElement = document.querySelector("#answer");

    const DISCLAIMER_PATTERN = /for research purposes only[\s\S]*not medical advice/i;
    const DISCLAIMER_MAX_LENGTH = 400;
    const DISCLAIMER_ICON = `
      <svg class="disclaimer-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="10.5" fill="#c97a00"/>
        <rect x="11" y="10.5" width="2" height="6.5" rx="1" fill="#fff"/>
        <circle cx="12" cy="7.5" r="1.25" fill="#fff"/>
      </svg>`;

    // Restyles the paragraph the backend already returns; its text is moved, never copied or edited.
    function styleDisclaimer(root) {
      const original = Array.from(root.querySelectorAll("p")).reverse().find(
        (paragraph) =>
          paragraph.textContent.length <= DISCLAIMER_MAX_LENGTH &&
          DISCLAIMER_PATTERN.test(paragraph.textContent),
      );
      if (!original) {
        return;
      }

      const note = document.createElement("aside");
      note.className = "disclaimer";
      note.setAttribute("role", "note");

      const title = document.createElement("div");
      title.className = "disclaimer-title";
      title.innerHTML = `${DISCLAIMER_ICON}<span>Important medical disclaimer</span>`;

      const text = document.createElement("p");
      text.className = "disclaimer-text";
      while (original.firstChild) {
        text.appendChild(original.firstChild);
      }

      note.append(title, text);
      original.replaceWith(note);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = questionField.value.trim();

      if (!question) {
        statusMessage.textContent = "Enter a question before submitting.";
        statusMessage.classList.add("error");
        questionField.focus();
        return;
      }

      if (askButton.disabled) {
        return;
      }

      askButton.disabled = true;
      askButton.textContent = "Researching…";
      statusMessage.textContent = "Searching the corpus and reviewing evidence…";
      statusMessage.classList.remove("error");
      answerCard.hidden = true;
      answerElement.textContent = "";

      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });

        const data = await response.json().catch(() => null);
        if (!response.ok) {
          const detail = typeof data?.detail === "string" ? data.detail : null;
          throw new Error(detail || `Request failed with status ${response.status}.`);
        }
        if (typeof data?.answer !== "string") {
          throw new Error("The server returned an invalid answer.");
        }

        const renderedAnswer = marked.parse(data.answer);
        answerElement.innerHTML = DOMPurify.sanitize(renderedAnswer, {
          USE_PROFILES: { html: true },
        });
        styleDisclaimer(answerElement);
        answerCard.hidden = false;
        statusMessage.textContent = "Answer ready.";
      } catch (error) {
        statusMessage.textContent = error instanceof Error
          ? error.message
          : "Unable to contact the research service. Please try again.";
        statusMessage.classList.add("error");
      } finally {
        askButton.disabled = false;
        askButton.textContent = "Ask";
      }
    });
  </script>
</body>
</html>
